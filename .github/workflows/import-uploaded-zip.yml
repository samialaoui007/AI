name: Import full media generator archive
on:
  push:
    branches: [main]
    paths:
      - source.tar.xz
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace repository with archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/imported-project"
          tar -xJf source.tar.xz -C "$RUNNER_TEMP/imported-project"
          test -f "$RUNNER_TEMP/imported-project/package.json"
          python3 - <<'PY'
          import pathlib, shutil, os
          root=pathlib.Path.cwd()
          for child in root.iterdir():
              if child.name=='.git': continue
              if child.is_dir(): shutil.rmtree(child)
              else: child.unlink()
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'imported-project'
          for child in source.iterdir():
              shutil.move(str(child),str(root/child.name))
          PY
      - name: Commit and push imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Replace old repository with uploaded media generator"
          git push origin HEAD:main
